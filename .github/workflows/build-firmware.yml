name: Build Taixingren M3 firmware

on:
  workflow_dispatch:
    inputs:
      immortalwrt_ref:
        description: "ImmortalWrt tag, branch, or commit"
        type: string
        required: true
        default: "v24.10.6"
      cache_epoch:
        description: "Change this value to force a fresh build cache"
        type: string
        required: false
        default: "v1"
      extra_packages:
        description: "Optional space-separated packages to preinstall"
        type: string
        required: false
        default: ""
      publish_release:
        description: "Publish the successful build as a GitHub Release"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.immortalwrt_ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  IMMORTALWRT_REF: ${{ inputs.immortalwrt_ref }}
  CACHE_EPOCH: ${{ inputs.cache_epoch }}
  EXTRA_PACKAGES: ${{ inputs.extra_packages }}
  CCACHE_MAX_SIZE: 4G

jobs:
  build:
    name: ImmortalWrt ${{ inputs.immortalwrt_ref }} / Taixingren M3
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space
        continue-on-error: true
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "false"
          remove-swapfile: "false"
          verbose: "false"

      - name: Checkout builder
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout official ImmortalWrt source
        uses: actions/checkout@v6
        with:
          repository: immortalwrt/immortalwrt
          path: immortalwrt
          ref: ${{ env.IMMORTALWRT_REF }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex g++-multilib gawk gcc-multilib gettext git \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp-dev \
            libgnutls28-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            lld llvm ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip upx-ucl wget xmlto xxd zlib1g-dev zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Apply Taixingren M3 source changes
        run: |
          git -C immortalwrt apply --check \
            ../taixingren-m3/patches/0001-enable-tf-card-for-k2p-profile.patch
          git -C immortalwrt apply \
            ../taixingren-m3/patches/0001-enable-tf-card-for-k2p-profile.patch
          grep -q 'status = "okay";' \
            immortalwrt/target/linux/ramips/dts/mt7621_phicomm_k2p.dts
          grep -q 'kmod-mmc-mtk' \
            immortalwrt/target/linux/ramips/image/mt7621.mk
          git -C immortalwrt diff --check

      - name: Prepare cache keys
        id: cache-vars
        shell: bash
        run: |
          mkdir -p immortalwrt/.ccache immortalwrt/dl
          ref_safe="$(printf '%s' "${IMMORTALWRT_REF}" | tr -c 'A-Za-z0-9._-' '_')"
          source_hash="$(find taixingren-m3 -type f -print0 | sort -z | \
            xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          echo "ref_safe=${ref_safe}" >> "$GITHUB_OUTPUT"
          echo "source_hash=${source_hash}" >> "$GITHUB_OUTPUT"
          echo "ccache_key=${{ runner.os }}-m3-ccache-${ref_safe}-${source_hash}-${CACHE_EPOCH}" >> "$GITHUB_OUTPUT"
          echo "dl_key=${{ runner.os }}-m3-dl-${ref_safe}-${CACHE_EPOCH}" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        id: restore-ccache
        continue-on-error: true
        uses: actions/cache/restore@v5.0.4
        with:
          path: immortalwrt/.ccache
          key: ${{ steps.cache-vars.outputs.ccache_key }}
          restore-keys: |
            ${{ runner.os }}-m3-ccache-${{ steps.cache-vars.outputs.ref_safe }}-
            ${{ runner.os }}-m3-ccache-

      - name: Restore source downloads
        id: restore-dl
        continue-on-error: true
        uses: actions/cache/restore@v5.0.4
        with:
          path: immortalwrt/dl
          key: ${{ steps.cache-vars.outputs.dl_key }}
          restore-keys: |
            ${{ runner.os }}-m3-dl-${{ steps.cache-vars.outputs.ref_safe }}-
            ${{ runner.os }}-m3-dl-

      - name: Configure firmware
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../taixingren-m3/seed.config .config
          read -r -a extra_packages <<< "${EXTRA_PACKAGES}"
          for package in "${extra_packages[@]}"; do
            case "${package}" in
              *[!A-Za-z0-9._+-]*)
                printf 'Invalid package name: %s\n' "${package}" >&2
                exit 1
                ;;
            esac
            printf 'CONFIG_PACKAGE_%s=y\n' "${package}" >> .config
          done
          make defconfig
          ./scripts/diffconfig.sh | tee ../taixingren-m3.config
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mmc-mtk=y$' .config

      - name: Download sources
        working-directory: immortalwrt
        run: make download -j"$(nproc)"

      - name: Build firmware
        id: compile
        working-directory: immortalwrt
        run: |
          export CCACHE_DIR="$(pwd)/.ccache"
          ccache -M "${CCACHE_MAX_SIZE}"
          jobs="$(nproc)"
          make -j"${jobs}" || make -j1 V=s
          echo "file_date=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Verify output
        shell: bash
        run: |
          shopt -s nullglob
          images=(immortalwrt/bin/targets/ramips/mt7621/*phicomm_k2p*)
          test "${#images[@]}" -gt 0
          printf '%s\n' "${images[@]}"
          sha256sum "${images[@]}" > taixingren-m3-sha256sums

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.restore-ccache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5.0.4
        with:
          path: immortalwrt/.ccache
          key: ${{ steps.cache-vars.outputs.ccache_key }}

      - name: Save source downloads
        if: ${{ !cancelled() && steps.restore-dl.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5.0.4
        with:
          path: immortalwrt/dl
          key: ${{ steps.cache-vars.outputs.dl_key }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: immortalwrt-${{ env.IMMORTALWRT_REF }}-taixingren-m3-${{ steps.compile.outputs.file_date }}
          path: |
            immortalwrt/bin/targets/ramips/mt7621/*phicomm_k2p*
            immortalwrt/bin/targets/ramips/mt7621/config.buildinfo
            immortalwrt/bin/targets/ramips/mt7621/feeds.buildinfo
            immortalwrt/bin/targets/ramips/mt7621/version.buildinfo
            taixingren-m3.config
            taixingren-m3-sha256sums
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: "taixingren-m3-${{ env.IMMORTALWRT_REF }}-${{ steps.compile.outputs.file_date }}"
          name: "Taixingren M3 / ImmortalWrt ${{ env.IMMORTALWRT_REF }}"
          body: |
            Experimental Phicomm K2P image for Taixingren M3, with the MT7621
            SD/MMC host enabled for the TF-card slot.
          files: |
            immortalwrt/bin/targets/ramips/mt7621/*phicomm_k2p*
            taixingren-m3.config
            taixingren-m3-sha256sums
